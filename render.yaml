# render.yaml — Blueprint для деплоя PinskUrbexBot на Render.
#
# Бот работает через long polling, но у Render бесплатный тариф есть
# только у Web Service (у Background Worker его нет), поэтому сервис
# оформлен как web: bot.py поднимает лёгкую HTTP-заглушку на $PORT
# специально для healthcheck'а, сам бот при этом ходит в Telegram
# как обычно, через long polling.
#
# Особенности бесплатного тарифа (см. render.com/pricing):
# - free-инстанс Web Service засыпает после ~15 минут без HTTP-трафика
#   и просыпается по следующему запросу (~30-60 сек). Long polling внутри
#   спящего процесса тоже не работает, поэтому бот на free-плане не будет
#   отвечать 24/7 без внешнего пингера (см. README).
# - free PostgreSQL живёт 30 дней, затем Render её удаляет. Для боевой
#   эксплуатации нужен платный план БД (от basic-256mb).

databases:
  - name: pinsk-urbex-db
    databaseName: pinsk_urbex
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: pinsk-urbex-bot
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: BOT_TOKEN
        sync: false
      # Токен бета-бота — только для локальных запусков (см. README). На
      # сервере BOT_TOKEN всегда заполнен, поэтому это поле игнорируется, но
      # по умолчанию оставляйте его пустым в дашборде Render.
      - key: BETA_BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: pinsk-urbex-db
          property: connectionString
      # Ключ шифрования персональных данных (см. utils/crypto.py) — Render
      # сгенерирует случайное значение сам при первом деплое и никогда не
      # покажет его в дашборде как редактируемый текст. Это осознанно НЕ
      # sync: false с ручным вводом — при generateValue человек вообще не
      # выбирает и не видит сам ключ, что снимает главный риск "банальных"
      # ключей (предсказуемость/повторное использование человеком).
      # Значение стабильно между деплоями одного сервиса, так что уже
      # накопленные зашифрованные данные останутся читаемыми.
      - key: APP_SECRET_KEY
        generateValue: true
      - key: CITY_NAME
        value: Пинск
      # Ссылка на GitHub-репозиторий — опционально, для команды /about.
      # Можно оставить пустым в дашборде Render, запуск не пострадает.
      - key: GITHUB_REPO_URL
        sync: false
